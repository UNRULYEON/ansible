# https://www.tech-otaku.com/mac/setting-the-date-and-time-format-for-the-macos-menu-bar-clock-using-terminal/

---
- name: Menubar | Show seconds
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: ShowSeconds
    type: bool
    value: true
  notify: Restart SystemUIServer
  tags: ['menubar']

- name: Menubar | Hide Spotlight icon
  community.general.osx_defaults:
    host: currentHost
    domain: com.apple.Spotlight
    key: MenuItemHidden
    type: int
    value: 1
  notify: Restart SystemUIServer
  tags: ['menubar']

- name: Menubar | Show battery percentage
  community.general.osx_defaults:
    host: currentHost
    domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: true
  notify: Restart ControlCenter
  tags: ['menubar']

- name: Menubar | Hide input source menu
  community.general.osx_defaults:
    domain: com.apple.TextInputMenu
    key: visible
    type: bool
    value: false
  notify: Restart SystemUIServer
  tags: ['menubar']
