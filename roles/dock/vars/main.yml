---
configure_dock: true
dockitems_remove:
  - 'App Store'
  - Calendar
  - Contacts
  - Downloads
  - FaceTime
  - Figma
  - Freeform
  - 'Google Chrome'
  - Keynote
  - Apps
  - Launchpad
  - Linear
  - Mail
  - Maps
  - Notes
  - Notion
  - 'Notion Calendar'
  - Numbers
  - Pages
  - Perplexity
  - Photos
  - Podcasts
  - Reminders
  - System Settings
  - TV
  - 'Visual Studio Code'
dockitems_persist:
  - name: 'Safari'
    path: '/Applications/Safari.app/'
    pos: 1
  - name: 'Helium'
    path: '/Applications/Helium.app/'
    pos: 2
  - name: 'Ghostty'
    path: '/Applications/Ghostty.app/'
    pos: 3
  - name: 'Zed'
    path: '/Applications/Zed.app/'
    pos: 4
  - name: 'Music'
    path: '/System/Applications/Music.app/'
    pos: 5
  - name: 'Claude'
    path: '/Applications/Claude.app/'
    pos: 6
  - name: 'Messages'
    path: '/System/Applications/Messages.app/'
    pos: 7
