---
- name: Dock | Setup Mac Dock
  ansible.builtin.include_role:
    name: geerlingguy.mac.dock
    apply:
      environment:
        PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:{{ ansible_env.PATH }}"
  when: configure_dock
  tags: ['dock']

- name: Dock | Configure Dock settings
  community.general.osx_defaults:
    domain: com.apple.dock
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  loop:
    - { key: orientation, type: string, value: left }
    - { key: tilesize, type: int, value: 32 }
    - { key: mineffect, type: string, value: scale }
    - { key: show-recents, type: bool, value: false }
    # Hot corners. 1 = off, 2 = Mission Control.
    - { key: wvous-bl-corner, type: int, value: 2 }
    - { key: wvous-bl-modifier, type: int, value: 0 }
    - { key: wvous-br-corner, type: int, value: 1 }
    - { key: wvous-br-modifier, type: int, value: 0 }
  notify: Restart Dock
  tags: ['dock']
