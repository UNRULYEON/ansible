---
- name: Dock | Setup Mac Dock
  ansible.builtin.include_role:
    name: geerlingguy.mac.dock
    apply:
      environment:
        PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:{{ ansible_env.PATH }}"
  when: configure_dock
  tags: ['dock']

- name: Dock | Configure Dock settings
  community.general.osx_defaults:
    domain: com.apple.dock
    key: '{{ item.key }}'
    type: '{{ item.type }}'
    value: '{{ item.value }}'
  loop:
    - { key: orientation, type: string, value: left }
    - { key: tilesize, type: int, value: 32 }
    - { key: mineffect, type: string, value: scale }
    - { key: show-recents, type: bool, value: false }
  notify: Restart Dock
  tags: ['dock']
